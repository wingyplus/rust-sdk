# Dagger workspace configuration
# Install modules with: dagger install <module>

# This repository is itself a Dang module, authored with sdk-sdk.
[modules.sdk-sdk]
source = "github.com/dagger/sdk-sdk"

[[modules.sdk-sdk.as-sdk.modules]]
path = "."

# ...and it is the Rust SDK. `check.skip` keeps `dagger check` from recursing
# into the SDK itself; the contract suite is run explicitly against sdk-sdk.
[modules.rust-sdk]
source = "."
check.skip = ["*"]

[modules.rust-sdk.as-sdk]
name = "rust"

# End-to-end checks for the Rust half of this SDK — the attribute macros and the
# generated client — which the contract suite above cannot reach, because it
# checks every SDK the same way. Discovered by a plain `dagger check`; see
# .dagger/modules/tests/README.md for what that costs.
[modules.tests]
source = ".dagger/modules/tests"
