[package]
name = "dagger"
version = "0.1.0"
edition = "2021"
# goish's floor. The runtime image must satisfy this too.
rust-version = "1.86"
license = "Apache-2.0"
description = "Dagger client library for Rust modules, built on goish."
repository = "https://github.com/wingyplus/rust-sdk"

# `test = false` is what makes `cargo test` work at all. Cargo would otherwise
# compile the lib a second time *as* a test target, and that links libtest,
# which is `std`: `std` and goish both define the `panic_impl` lang item, so
# they collide (E0152) before a single test runs. The tests live in one
# harness-less target instead — see tests/querybuilder.rs. `doctest = false` is the
# same story for doc examples, and keeps a stray ``` block from reintroducing
# it; the examples in these docs are `ignore`d anyway, since they show generated
# code that does not exist yet.
[lib]
path = "src/lib.rs"
test = false
doctest = false

# goish ships Go's `testing` package, so the suite is a `main` that hands its
# tests to `testing::Main` — the same shape `go test` generates — rather than
# `#[test]` functions libtest collects. `harness = false` tells cargo to run the
# binary and read its exit status instead of injecting a harness of its own.
[[test]]
name = "querybuilder"
path = "tests/querybuilder.rs"
harness = false

[dependencies]
# Pinned by git rev: goish is not published to crates.io. The same rev is
# pinned in templates/*/Cargo.toml.tmpl so cargo unifies the two into one
# checkout — they must be bumped together.
goish = { git = "https://github.com/cogentica-ai/goish", rev = "ff061453ffd2533bb22ea68c8ccb176616aa4b5e" }
# Host-built proc-macro crate; see its Cargo.toml for why it is the one non-no_std
# piece here. Vendored alongside this crate into every module.
dagger-macros = { path = "./macros" }

# No [profile] sections here on purpose. This crate is always consumed as a path
# dependency of a module, where cargo ignores a non-root package's profiles and
# warns about them. The `panic = "abort"` goish needs is set by the module's own
# Cargo.toml — see templates/*/Cargo.toml.tmpl.
